<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>The Four Knights · API Knights</title>
  <meta name="description" content="GET, POST, PUT and DELETE with live, animated requests.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%235a2a27'/%3E%3Ctext x='16' y='21' font-family='monospace' font-weight='700' font-size='11' text-anchor='middle' fill='%23f8f5f1'%3EAPI%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var t=JSON.parse(localStorage.getItem('apik.theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <script defer src="js/common.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/scheme.js"></script>
  <script defer src="js/knights.js"></script>
</head>
<body data-page="knights">
<main id="main" class="wrap">

  <section class="hero hero--sm">
    <span class="eyebrow">02 — Methods</span>
    <h1>Four <span class="dim">knights</span></h1>
    <p class="lead">The method says what to do.</p>
  </section>

  <section class="block" style="padding-top:12px" aria-labelledby="pick-h">
    <h2 class="sr-only" id="pick-h">Choose a knight</h2>
    <div class="knights" role="tablist" aria-label="Choose a knight" id="tabs"></div>
    <div class="kpanel" id="kpanel" role="tabpanel" aria-live="polite"></div>
  </section>

  <section class="block" style="padding-top:8px" aria-labelledby="mission-h">
    <h2 id="mission-h" class="sr-only">Send the knight</h2>
    <div class="try-row">
      <button type="button" class="btn btn--method btn--lg" id="send"></button>
      <p class="hint" id="hint"></p>
      <div class="order" id="order" aria-label="Suggested order"></div>
    </div>
    <div id="scheme"></div>
  </section>

  <section class="block" style="padding-top:8px" aria-labelledby="look-h">
    <h2 id="look-h" class="sr-only">Inside the messages</h2>
    <div id="insp"></div>
    <span class="label">Code</span>
    <div id="code"></div>
  </section>
</main>
</body>
</html>
