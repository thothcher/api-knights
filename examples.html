<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Real examples · API Knights</title>
  <meta name="description" content="Get data, register, log in, edit and delete — five real API flows, animated.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%235a2a27'/%3E%3Ctext x='16' y='21' font-family='monospace' font-weight='700' font-size='11' text-anchor='middle' fill='%23f8f5f1'%3EAPI%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/styles.css">
  <script>try{var t=JSON.parse(localStorage.getItem('apik.theme'));if(t)document.documentElement.dataset.theme=t}catch(e){}</script>
  <script defer src="js/common.js"></script>
  <script defer src="js/api.js"></script>
  <script defer src="js/ui.js"></script>
  <script defer src="js/scheme.js"></script>
  <script defer src="js/examples.js"></script>
</head>
<body data-page="examples">
<main id="main" class="wrap">

  <section class="hero hero--sm">
    <span class="eyebrow">03 — Examples</span>
    <h1>Everyday <span class="dim">flows</span></h1>
    <p class="lead">Use the app. Watch the data travel.</p>
  </section>

  <section class="block" style="padding-top:8px" aria-labelledby="ex-h">
    <h2 class="sr-only" id="ex-h">Choose an example</h2>
    <div class="knights auto" role="tablist" aria-label="Choose an example" id="tabs"></div>
    <div class="card" style="margin-top:8px" id="story" aria-live="polite"></div>
    <div style="margin-top:8px" id="scheme"></div>
  </section>

  <section class="block" style="padding-top:8px" aria-labelledby="look-h">
    <h2 id="look-h" class="sr-only">Inside the messages</h2>
    <div id="insp"></div>
    <span class="label">Code</span>
    <div id="code"></div>
    <div class="note warn" style="margin-top:18px">
      <svg class="ico" aria-hidden="true"><use href="#i-lock"></use></svg>
      <p>Shared public server. Fake data only. Passwords are never sent.</p>
    </div>
    <p style="margin-top:14px"><button type="button" class="btn btn--sm" id="reset"><svg class="ico" aria-hidden="true"><use href="#i-replay"></use></svg> Reset practice data</button></p>
  </section>
</main>
</body>
</html>
